apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cake_delight_2-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"

            - name: MONGO_URI
              value: "mongodb://order-mongodb:27017/order_db"

            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:5001"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"

            - name: EVENT_EXCHANGE
              value: "cake_delight_events"

            - name: NODE_ENV
              value: "production"
